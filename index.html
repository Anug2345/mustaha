    <script>
      (function() {
        function isExtensionError(msg, src) {
          var text = String(msg || '');
          var source = String(src || '');
          return (
            text.indexOf('MetaMask') !== -1 ||
            text.indexOf('metamask') !== -1 ||
            text.indexOf('ethereum') !== -1 ||
            text.indexOf('Failed to connect to MetaMask') !== -1 ||
            text.indexOf('Extension context invalidated') !== -1 ||
            source.indexOf('chrome-extension') !== -1 ||
            source.indexOf('moz-extension') !== -1
          );
        }

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event ? (event.reason || event) : null;
          var msg = (reason && (reason.message || reason.stack || String(reason))) || '';
          if (isExtensionError(msg, '')) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
            return true;
          }
        }, true);

        window.addEventListener('error', function(event) {
          var msg = (event && (event.message || (event.error && event.error.message))) || '';
          var src = (event && (event.filename || (event.error && event.error.stack))) || '';
          if (isExtensionError(msg, src)) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
            return true;
          }
        }, true);
      })();
    </script>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('mz-portfolio-theme');
          var isDark = saved === 'dark' || ((!saved || saved === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
